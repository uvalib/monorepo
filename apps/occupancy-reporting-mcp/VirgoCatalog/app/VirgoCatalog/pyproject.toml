[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "VirgoCatalog"
version = "0.1.0"
description = "AgentCore MCP Server — UVA Library Catalog Search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp >= 1.19.0",
    "uvicorn",
    "requests",
    "python-dotenv",
    "cryptography",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
