AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  HooHelp Slack Bot — Slack Events API via Lambda + HTTP API.
  Slack secrets are loaded at runtime from SSM SecureString so plain
  `sam deploy` cannot wipe tokens (CFN cannot inject ssm-secure into Lambda env).

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 1024
    Timeout: 120
    Environment:
      Variables:
        LOG_LEVEL: INFO
        # Required by slack-bolt AWS Lambda adapter for lazy (async) listeners
        AWS_LAMBDA_LOG_LEVEL: INFO

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name / resource name suffix.

  SlackBotTokenSsmPath:
    Type: String
    Default: /hoohelp/slack/bot-token
    Description: >
      SSM SecureString path for the Slack bot token (xoxb-...).
        aws ssm put-parameter --name /hoohelp/slack/bot-token --type SecureString --value "xoxb-..." --overwrite

  SlackSigningSecretSsmPath:
    Type: String
    Default: /hoohelp/slack/signing-secret
    Description: >
      SSM SecureString path for the Slack signing secret.
        aws ssm put-parameter --name /hoohelp/slack/signing-secret --type SecureString --value "..." --overwrite

  GatewayUrl:
    Type: String
    Default: "https://occupancy-reporting-gateway-mohw8c1jug.gateway.bedrock-agentcore.us-east-1.amazonaws.com/mcp"
    Description: Public AgentCore MCP Gateway URL (tools backends stay on AgentCore).

  BedrockModelId:
    Type: String
    Default: "minimax.minimax-m2.5"
    Description: Bedrock Converse model for the MCP tool-calling agent (MiniMax M2.5).

  SlackFormatModelId:
    Type: String
    Default: "google.gemma-4-31b"
    Description: >
      Bedrock Mantle model for optional Slack Block Kit formatting (Gemma 4 31B).
      Only used when SLACK_LLM_FORMAT is "true" (off by default).
      Gemma is mantle-only; it is invoked via Chat Completions with tool_choice
      locked to the Block Kit JSON schema.

  ShowModelReasoning:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      If true, model <thinking> blocks are shown under the answer as muted
      Slack context. Default false strips them (recommended for library help).

  ConversationTrace:
    Type: String
    Default: "both"
    AllowedValues: ["off", "cloudwatch", "s3", "both"]
    Description: >
      Where to store per-turn agent transcripts (user prompt, tools, results, answer).
      cloudwatch = JSON log line; s3 = full JSON in TraceBucket; both = summary + full.

  TraceRetentionDays:
    Type: Number
    Default: 30
    Description: S3 lifecycle expiration for session traces (days).

  EnableGuardrails:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      When true, Lambda Converse calls use the HooHelp Bedrock Guardrail
      (content filters, denied out-of-scope topics, PII anonymize, profanity).

  EnableSlackSearch:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      When true, Hoo Helper can search public Slack channels (search_slack) and
      read public threads (read_slack_thread). Needs search:read.public.

  SlackSearchAllow:
    Type: String
    Default: ""
    Description: >
      Optional rollout allow-list: comma-separated channel and/or user ids that
      get Slack search. Empty = everyone (when EnableSlackSearch is true).

  EnableAtlassian:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      When true, Hoo Helper can search and read the Library's Confluence pages and
      Jira issues (read-only), using the service account in SSM /hoohelp/atlassian/.

  EnableGitHub:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      When true, Hoo Helper can search and read uvalib GitHub code, issues and pull
      requests (read-only), using the GitHub App credentials in SSM /hoohelp/github/.

  AtlassianTokenType:
    Type: String
    Default: "scoped"
    AllowedValues: ["classic", "scoped"]
    Description: Kind of Atlassian API token in SSM (scoped tokens go through api.atlassian.com).

  ConfluenceSpaces:
    Type: String
    Default: ""
    Description: Comma-separated Library Confluence space keys Hoo Helper may read (empty = Confluence off).

  JiraProjects:
    Type: String
    Default: ""
    Description: Comma-separated Library Jira project keys Hoo Helper may read (empty = Jira off).

Resources:
  # Slack search action tokens, saved per thread so unmentioned follow-ups can
  # search. Items expire after 24 h (expires_at) or when Slack rejects them.
  HooHelpActionTokens:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "hoohelp-action-tokens-${StageName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------------
  # Bedrock Guardrails — library assistant safety (input + output)
  # Applied on Converse in agent.py and slack_format.py
  # ---------------------------------------------------------------------------
  HooHelpGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "hoohelp-library-assistant-${StageName}"
      Description: >
        UVA Library HooHelp Slack assistant: filter harmful content and prompt
        attacks, deny out-of-scope advice topics, mask sensitive PII.
      BlockedInputMessaging: >-
        I'm Hoo Helper, the UVA Library assistant. I can help with library hours,
        rooms and equipment, events, gate counts, the Virgo catalog and images,
        Special Collections archives and finding aids, library policies, buses and
        walking directions, and searching our Slack and Jira. I can't help with
        that request. Please rephrase, or contact a librarian:
        https://www.library.virginia.edu/askalibrarian
      BlockedOutputsMessaging: >-
        I'm not able to share that response. I can help with UVA Library hours,
        rooms, events, gate counts, the catalog, Special Collections archives,
        policies, buses, and our Slack and Jira — or you can Ask a Librarian:
        https://www.library.virginia.edu/askalibrarian
      # Harmful categories + prompt injection. Strengths balanced for a public
      # academic library help desk (avoid over-blocking literature/history topics).
      ContentPolicyConfig:
        FiltersConfig:
          # Archival research is often about hate history (KKK records, Nazi
          # propaganda, the 2017 Unite the Right rally): the input filter blocked
          # those staff questions at MEDIUM and even HIGH confidence, so it's off
          # for input; answers are still blocked at HIGH confidence.
          - Type: HATE
            InputStrength: NONE
            OutputStrength: LOW
          - Type: INSULTS
            InputStrength: LOW
            OutputStrength: MEDIUM
          - Type: SEXUAL
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: VIOLENCE
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: MISCONDUCT
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          # MEDIUM: HIGH also blocked LOW-confidence hits, which caught ordinary
          # "what can you do?" turns in the Oct 2026 staff trial.
          - Type: PROMPT_ATTACK
            InputStrength: MEDIUM
            OutputStrength: NONE
      # No managed profanity word list: it treats historical terms ("Nazi",
      # "Ku Klux Klan") as profanity, which blocks real collection questions.
      # Topics clearly outside a library assistant's role (still allow catalog
      # questions *about* law/medicine books — definition targets advice-giving).
      TopicPolicyConfig:
        TopicsConfig:
          - Name: MedicalDiagnosisAndTreatment
            Type: DENY
            Definition: >-
              Requests for medical diagnosis, treatment plans, dosing, or clinical
              care advice (not finding medical books or research help).
            Examples:
              - "Do I have strep based on these symptoms?"
              - "What antibiotic dose should I take?"
              - "How do I suture a wound at home?"
          - Name: LegalAdvice
            Type: DENY
            Definition: >-
              Requests for legal advice or case strategy for a real dispute (not
              locating law books or catalog research).
            Examples:
              - "Write a contract for my landlord dispute"
              - "How should I plead in court tomorrow?"
              - "What legal steps against my neighbor?"
          - Name: CybercrimeAndMalware
            Type: DENY
            Definition: >-
              Requests to create malware, phishing, or unauthorized hacking of
              systems or accounts.
            Examples:
              - "Write a ransomware script"
              - "How do I phish student credentials?"
              - "Help me break into this Wi-Fi network"
          - Name: WeaponsAndExplosivesHowTo
            Type: DENY
            Definition: >-
              Step-by-step instructions for building weapons or explosives (not
              historical or catalog research).
            Examples:
              - "How do I make a bomb?"
              - "Build a gun from household parts"
          - Name: SelfHarmInstructions
            Type: DENY
            Definition: >-
              Requests for methods of suicide or self-harm; crisis help should
              be offered instead of instructions.
            Examples:
              - "What is the best way to kill myself?"
              - "How can I hurt myself unnoticed?"
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - Type: US_SOCIAL_SECURITY_NUMBER
            Action: ANONYMIZE
          - Type: CREDIT_DEBIT_CARD_NUMBER
            Action: ANONYMIZE
          - Type: CREDIT_DEBIT_CARD_CVV
            Action: ANONYMIZE
          - Type: CREDIT_DEBIT_CARD_EXPIRY
            Action: ANONYMIZE
          - Type: US_BANK_ACCOUNT_NUMBER
            Action: ANONYMIZE
          - Type: US_BANK_ROUTING_NUMBER
            Action: ANONYMIZE
          - Type: PASSWORD
            Action: ANONYMIZE
          - Type: AWS_ACCESS_KEY
            Action: ANONYMIZE
          - Type: AWS_SECRET_KEY
            Action: ANONYMIZE
          - Type: PIN
            Action: ANONYMIZE
      Tags:
        - Key: Application
          Value: hoohelp-slack-bot
        - Key: Stage
          Value: !Ref StageName
        - Key: UseCase
          Value: library-assistant

  HooHelpGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      # Changing this description makes CloudFormation cut a new version from the
      # current guardrail settings (the Lambda reads its number via GetAtt).
      Description: !Sub "Production snapshot for HooHelp (${StageName}) - prompt-attack MEDIUM, hate input off, no profanity list, archives"
      GuardrailIdentifier: !GetAtt HooHelpGuardrail.GuardrailId

  # Full tool transcripts for MCP development (partitioned by date)
  HooHelpTraceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "hoohelp-session-traces-${StageName}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTraces
            Status: Enabled
            ExpirationInDays: !Ref TraceRetentionDays

  HooHelpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "hoohelp-slack-bot-${StageName}"
      Description: HooHelp Slack Events API handler (Bolt + Bedrock + MCP Gateway)
      CodeUri: src/
      Handler: app.handler
      Environment:
        Variables:
          SLACK_BOT_TOKEN_SSM_PATH: !Ref SlackBotTokenSsmPath
          SLACK_SIGNING_SECRET_SSM_PATH: !Ref SlackSigningSecretSsmPath
          GATEWAY_URL: !Ref GatewayUrl
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          SHOW_MODEL_REASONING: !Ref ShowModelReasoning
          # Optional second call that reformats the draft as Block Kit (Gemma 4 31B
          # on mantle). Off: it collapsed long answers and tables to one sentence.
          # The agent's mrkdwn is cleaned and laid out in code instead.
          SLACK_LLM_FORMAT: "false"
          SLACK_FORMAT_MODEL_ID: !Ref SlackFormatModelId
          # Session transcripts for MCP / prompt development
          CONVERSATION_TRACE: !Ref ConversationTrace
          CONVERSATION_TRACE_BUCKET: !Ref HooHelpTraceBucket
          CONVERSATION_TRACE_PREFIX: traces
          # Bedrock Guardrails (library assistant)
          BEDROCK_GUARDRAIL_ENABLED: !Ref EnableGuardrails
          BEDROCK_GUARDRAIL_ID: !GetAtt HooHelpGuardrail.GuardrailId
          BEDROCK_GUARDRAIL_VERSION: !GetAtt HooHelpGuardrailVersion.Version
          BEDROCK_GUARDRAIL_TRACE: enabled
          # Slack search (public channels) and its per-thread action tokens
          ENABLE_SLACK_SEARCH: !Ref EnableSlackSearch
          SLACK_SEARCH_ALLOW: !Ref SlackSearchAllow
          ACTION_TOKENS_TABLE: !Ref HooHelpActionTokens
          # Confluence / Jira (read-only, Library spaces and projects only)
          ENABLE_ATLASSIAN: !Ref EnableAtlassian
          ENABLE_GITHUB: !Ref EnableGitHub
          ATLASSIAN_SITE: https://virginia-its.atlassian.net
          ATLASSIAN_CLOUD_ID: c417cfa5-aa30-4f3f-be7e-968c5845b5e9
          ATLASSIAN_TOKEN_TYPE: !Ref AtlassianTokenType
          CONFLUENCE_SPACES: !Ref ConfluenceSpaces
          JIRA_PROJECTS: !Ref JiraProjects
          ATLASSIAN_EMAIL_SSM_PATH: /hoohelp/atlassian/email
          ATLASSIAN_JIRA_TOKEN_SSM_PATH: /hoohelp/atlassian/jira-token
          ATLASSIAN_CONFLUENCE_TOKEN_SSM_PATH: /hoohelp/atlassian/confluence-token
      Policies:
        # Read Slack secrets from SSM SecureString at cold start
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SlackBotTokenSsmPath}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SlackSigningSecretSsmPath}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hoohelp/atlassian/email"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hoohelp/atlassian/jira-token"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hoohelp/atlassian/confluence-token"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hoohelp/github/*"
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
        # Bedrock Converse (MiniMax agent + Guardrails) and Mantle (Gemma formatter)
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:Converse
                - bedrock:ConverseStream
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:ApplyGuardrail
              Resource:
                - !GetAtt HooHelpGuardrail.GuardrailArn
                - !Sub "${HooHelpGuardrail.GuardrailArn}/*"
            - Effect: Allow
              Action:
                - bedrock-mantle:CreateInference
                - bedrock-mantle:Get*
                - bedrock-mantle:List*
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/*"
                - !Sub "arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:*"
        # slack-bolt lazy listeners re-invoke this function asynchronously
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:hoohelp-slack-bot-${StageName}"
        # Slack search action tokens (this table only)
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt HooHelpActionTokens.Arn
        # Write session traces for MCP development
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:AbortMultipartUpload
              Resource: !Sub "${HooHelpTraceBucket.Arn}/*"
      Events:
        SlackEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref HooHelpHttpApi
            Method: POST
            Path: /slack/events
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HooHelpHttpApi
            Method: GET
            Path: /health

  HooHelpHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      Description: HTTP API for HooHelp Slack Events

Outputs:
  SlackEventsUrl:
    Description: Paste into Slack App → Event Subscriptions → Request URL.
    Value: !Sub "https://${HooHelpHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/slack/events"

  HealthUrl:
    Description: Health check endpoint.
    Value: !Sub "https://${HooHelpHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/health"

  FunctionName:
    Description: Lambda function name.
    Value: !Ref HooHelpFunction

  FunctionArn:
    Description: Lambda function ARN.
    Value: !GetAtt HooHelpFunction.Arn

  ApiId:
    Description: HTTP API id.
    Value: !Ref HooHelpHttpApi

  TraceBucketName:
    Description: S3 bucket for full session traces (MCP development).
    Value: !Ref HooHelpTraceBucket

  TraceBucketArn:
    Description: ARN of the session-trace bucket.
    Value: !GetAtt HooHelpTraceBucket.Arn

  GuardrailId:
    Description: Bedrock Guardrail id used by HooHelp Converse calls.
    Value: !GetAtt HooHelpGuardrail.GuardrailId

  GuardrailArn:
    Description: Bedrock Guardrail ARN.
    Value: !GetAtt HooHelpGuardrail.GuardrailArn

  GuardrailVersion:
    Description: Published guardrail version number.
    Value: !GetAtt HooHelpGuardrailVersion.Version
